# BRAT (and Obsidian) install beta plugins from GitHub *Releases* with attached
# manifest.json, main.js, and styles.css — not from bare git tags. This job
# runs whenever a semver tag is pushed and publishes those three files.
#
# Ref: https://github.com/TfTHacker/obsidian42-brat/blob/main/BRAT-DEVELOPER-GUIDE.md
name: Release

on:
  push:
    tags:
      # Plain semver tags (this repo does not use a `v` prefix).
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semver tag to publish (e.g. repair 0.0.10)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ github.event.inputs.tag }}"
          else
            T="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$T" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be plain semver X.Y.Z (got: $T)" >&2
            exit 1
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin bundle
        run: npm run build

      - name: Verify release files exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Publish GitHub Release (BRAT / Obsidian)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
