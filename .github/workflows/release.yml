# BRAT (and Obsidian) install beta plugins from GitHub *Releases* with attached
# manifest.json, main.js, and styles.css — not from bare git tags. This job
# runs whenever a semver tag is pushed and publishes those three files.
#
# Tags may be plain X.Y.Z or feature builds like X.Y.Z-feat.name.N — BRAT
# accepts both. Do not flatten a deliberate feat tag to plain X.Y.Z.
#
# Ref: https://github.com/TfTHacker/obsidian42-brat/blob/main/BRAT-DEVELOPER-GUIDE.md
name: Release

on:
  push:
    tags:
      # Semver tags (no `v` prefix). Also matches X.Y.Z-feat.* prerelease tags.
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semver tag to publish (e.g. 0.5.6 or 0.5.6-feat.neural-review.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ github.event.inputs.tag }}"
          else
            T="${GITHUB_REF_NAME}"
          fi
          # Plain X.Y.Z or X.Y.Z with optional -prerelease / +build (semver).
          if [[ ! "$T" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "Tag must be semver X.Y.Z or X.Y.Z-prerelease (got: $T)" >&2
            exit 1
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          if [[ "$T" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin bundle
        run: npm run build

      - name: Verify release files exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          # Release tag and shipped manifest.version must match for BRAT.
          MANIFEST_VER=$(node -p 'require("./manifest.json").version')
          if [ "$MANIFEST_VER" != "${{ steps.meta.outputs.tag }}" ]; then
            echo "manifest.json version ($MANIFEST_VER) != tag (${{ steps.meta.outputs.tag }})" >&2
            exit 1
          fi

      - name: Publish GitHub Release (BRAT / Obsidian)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
